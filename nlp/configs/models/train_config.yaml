trainer:
    evaluation_strategy: steps
    per_device_train_batch_size: 1
    per_device_eval_batch_size: 1
    gradient_accumulation_steps: 64
    eval_steps: 16
    save_steps: 16
    logging_steps: 1
    learning_rate: 0.0007
    embedding_learning_rate: 0.0001
    num_train_epochs: 1
    lr_scheduler_type: cosine
    warmup_steps: 16
    bf16: true
    fp16: false
    optim: adamw_8bit
    load_best_model_at_end: true
    save_total_limit: 1
    seed: 1337
    weight_decay: 0.01
    report_to: ''
adaptation:
    method: lora
    r: 256
    lora_alpha: 64
    lora_dropout: 0.0
    bias: none
    target_modules: [q_proj, v_proj, k_proj, o_proj, gate_proj, up_proj, down_proj]
    modules_to_save: [embed_tokens, lm_head]
    tie_word_embeddings_if_been_tied: true
    use_gradient_checkpointing: unsloth
unfreeze_modules: [embed_tokens]            # модули которые будут обучаемыми в случае если не используем адаптацию (adaptation не задан)
quantization_config:
    load_in_8bit: false
    load_in_4bit: true
data:
    sample_rate: 1.0
only_target_loss: true
model_name: models/saiga_nemo_12b
max_tokens_count: 16384
max_seq_length: 16384
tokenize:
    bos_token: <s>
    eos_token: </s>
    pad_token: <pad>
common:
    save_tokenizer: false
